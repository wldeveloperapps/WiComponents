name: Publish GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: pnpm build:mcp
      - name: Auth GitHub Packages
        run: |
          echo '@wldeveloperapps:registry=https://npm.pkg.github.com' >> .npmrc
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @wldeveloperapps/ui and ui-mcp
        run: pnpm publish:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
